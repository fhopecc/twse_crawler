[build-system]
requires = ["hatchling>=1.26,<1.32"]
build-backend = "hatchling.build"

[project]
name = "twse_crawler"
version = "0.1.1"
authors = [
  { name="fhopecc", email="fhopecc@gmail.com" },
]
description = "臺股分析集"
readme = "README.md"
license = { text = "GPL-3.0-only" } 
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "zhongwen"
]

[project.urls]
"Homepage" = "https://github.com/fhopecc/twse_crawler"
"Bug Tracker" = "https://github.com/fhopecc/twse_crawler/issues"

[tool.hatch.build.targets.wheel]
packages = ["."]
